name: Source checks
# Hosted runs are switched off: every check runs locally (see docs/RELEASING.md and docs/PUBLICATION.md).
# Manual start only; nothing starts on a push or pull request.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: swift run PipCoreChecks
      - run: swift run PipDictationChecks
      - run: python3 tests/publication-export.test.py && python3 tests/launch-help.test.py && python3 tests/release-package.test.py
        env:
          PIP_TEST_ROOT: ${{ runner.temp }}
# No provider keys, live inference, artifact upload, signing or self-hosted runner.
# Export and disclosure review run locally BEFORE public pushes, not after exposure.
