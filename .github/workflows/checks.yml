name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: swift run PipCoreChecks
      - run: swift run PipDictationChecks
      - run: python3 tests/publication-export.test.py && python3 tests/launch-help.test.py
        env:
          PIP_TEST_ROOT: ${{ runner.temp }}
# No provider keys, live inference, artifact upload, signing or self-hosted runner.
# Export and disclosure review run locally BEFORE public pushes, not after exposure.
