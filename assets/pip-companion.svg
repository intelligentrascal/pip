<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none">
<title>Pip, an original house-elf companion</title>
<desc>A friendly sage-green elf with large leaf-shaped ears, a copper scarf and a mended indigo coat holds a little brass lantern.</desc>
<defs>
 <linearGradient id="skin" x1="180" y1="110" x2="310" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#C4D1A5"/><stop offset="1" stop-color="#819C78"/></linearGradient>
