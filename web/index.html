<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Pip personal assistant</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="emberweave.css"></head>
<body><div id="surface"><div id="ew-roll" hidden></div><div id="apparition" aria-hidden="true"><pip-character id="character"></pip-character><pip-living-ink id="ink"></pip-living-ink></div><main class="panel" aria-label="Pip personal assistant">
<header id="header"><h1>Pip</h1><span id="workStatus" role="status" aria-live="polite">Ready</span><button id="tracker">Tracker</button><button id="hide" aria-label="Hide Pip popup">Close</button></header>
<div id="conversation" inert><section id="dictation" aria-label="Reviewable dictation" hidden><h2>On-device dictation</h2><p id="dictation-status" role="status" aria-live="polite"></p><label id="transcript-label" for="transcript">Transcript — review before adding</label><textarea id="transcript" maxlength="12000" rows="3"></textarea><div class="actions"><button id="dictation-stop" type="button">Stop capture</button><button id="dictation-use" type="button">Add to composer</button><button id="dictation-cancel" type="button">Cancel dictation</button></div><details><summary>Privacy and Ask</summary><p class="label">No audio recording is saved. Adding text does not send it. Review the composer, then choose Ask.</p></details></section><section id="result" aria-label="Current work"></section><div id="recent" aria-label="Recent work"></div></div>
<form id="ask"><label class="sr" for="composer">What would you like a hand with?</label><div class="input"><textarea id="composer" rows="1" maxlength="12000" placeholder="What would you like a hand with?"></textarea><button id="talk" type="button">Talk</button><button class="primary arrow" type="submit" aria-label="Ask Pip">↑</button></div></form>
<nav class="starters" aria-label="Prompt starters"><button data-prompt="Research ">Research</button><button id="browser">Browse</button><button data-prompt="Help me write ">Write</button><button data-view="remember">Remember</button><button data-prompt="Help me plan my day: ">Plan my day</button></nav><footer><button id="settings">Settings</button><span id="shortcut">⌘⇧E to summon</span><button id="feedback">Feedback</button></footer><div id="status" role="status" aria-live="polite">Screen context is not connected yet. Nothing is captured or shared.</div>
</main></div><canvas id="ew-fx" aria-hidden="true"></canvas><svg id="ew-props" aria-hidden="true" focusable="false" preserveAspectRatio="none">
<g data-for="approval blocked"><line id="ew-rest-line" class="brass"/></g>
<g data-for="approval" id="ew-clip"><path class="brass-fill" d="M0 0h18v7h-12v10h-6z"/></g>
<g data-for="blocked"><polygon id="ew-fold-band" class="fold"/><polygon id="ew-fold-flap" class="flap"/><path id="ew-thread" class="thread"/></g>
<g data-for="unknown"><path id="ew-knot" class="knot" d="M-10 4C-12-10 10-6 0 3C-14 14-14-6 -2 -2"/></g>
<g data-for="done"><g id="ew-seal"><circle r="10" class="seal"/><path d="M-4 0l3 3 6-7" class="tick"/></g></g>
<g data-for="listening"><g id="ew-mic"><circle r="3" class="brass-fill"/><circle r="7" class="ring"/></g><g id="ew-meter"><rect x="0" width="2" height="2"/><rect x="4" width="2" height="2"/><rect x="8" width="2" height="2"/><rect x="12" width="2" height="2"/><rect x="16" width="2" height="2"/><rect x="20" width="2" height="2"/></g></g>
<g data-for="thinking"><path id="ew-route" class="route" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><g id="ew-islands"><circle r="3.5"/><circle r="3.5"/><circle r="3.5"/></g></g>
<g data-for="working"><line id="ew-rail-line" class="rail"/><path id="ew-writing" class="writing"/></g>
<g data-for="tracker"><path id="ew-slip" class="slip" d="M-7-9h14v18h-14z"/></g>
<g id="ew-quill" opacity="0"><path class="quill" d="M0 0C-1-9 6-17 14-20C12-10 7-3 0 0M0 0L-6 4"/></g>
</svg><!-- pip-character-rig --><script src="app.bundle.js"></script></body></html>
