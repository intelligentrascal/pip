<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Pip personal assistant</title><link rel="stylesheet" href="lantern.css"></head>
<body data-scene="ready"><div id="stage"><main id="win" aria-label="Pip personal assistant">
<i id="grip-l" class="grip" aria-hidden="true" title="Drag to change the width"></i><i id="grip-t" class="grip" aria-hidden="true" title="Drag to change the most height"></i>
<header id="header"><i id="dot"></i><h1 id="title">Pip</h1><span id="workStatus" role="status" aria-live="polite">Ready</span><span id="header-buttons"></span></header>
<div id="menu" hidden role="menu" aria-label="More"></div>
<div id="cv" class="cv" tabindex="0" aria-label="Conversation" aria-live="polite" hidden></div>
<div id="tl" class="tl" hidden aria-label="Chats"></div>
<section id="result" aria-label="Current view" hidden></section>
<button id="latest" type="button" hidden>Latest</button>
<div id="dock" hidden role="group" aria-label="Paused step"></div>
<section id="dictation" aria-label="Reviewable dictation" hidden><h2>On-device dictation</h2><p id="dictation-status" role="status" aria-live="polite"></p><label id="transcript-label" for="transcript">Transcript — review before adding</label><textarea id="transcript" maxlength="12000" rows="3"></textarea><div class="actions"><button id="dictation-stop" type="button">Stop capture</button><button id="dictation-use" type="button">Add to message</button><button id="dictation-cancel" type="button">Cancel dictation</button></div><details><summary>Privacy and Send</summary><p>No audio recording is saved. Adding text does not send it. Review the message, then press Send.</p></details></section>
<button id="resume" type="button" hidden></button>
<div id="chips" hidden><button class="cp" type="button" data-prompt="Help me plan my day: ">Plan my day</button><button class="cp" type="button" data-prompt="Research ">Research</button><button class="cp" type="button" data-prompt="Help me write ">Write</button></div>
<form id="ask"><label class="sr" for="composer">Message to Pip</label><textarea id="composer" rows="1" maxlength="12000" placeholder="Ask Pip anything"></textarea><span id="level" class="lb" hidden><i></i><i></i><i></i><i></i><i></i></span><button id="talk" class="ib" type="button" aria-label="Talk" title="Talk"></button><button id="send" class="sd" type="submit" aria-label="Send"></button></form>
<footer class="ft"><span id="status" role="status" aria-live="polite">Saved on this Mac</span><span id="shortcut">⌘⇧E hides</span></footer>
</main><div id="apparition" aria-hidden="true"><pip-character id="character"></pip-character></div><canvas id="fx" aria-hidden="true" hidden></canvas></div><!-- pip-character-rig --><script src="app.bundle.js"></script></body></html>
